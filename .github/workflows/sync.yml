name: Sync site from SatyamSaxena1.github.io

# This repository is a mirror: it serves the same site as https://satyamsaxena1.github.io/ on the custom domain.
# Edit the source repo, not this one. The workflow copies the source over every 20 minutes (or on demand).
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SatyamSaxena1/SatyamSaxena1.github.io
          path: _src
      - name: Copy the site over (keeps this repo's own CNAME, README and workflow)
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='CNAME' --exclude='README.md' --exclude='_src/' _src/ ./
          rm -rf _src
      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Already in sync."; else git commit -m "Sync site from SatyamSaxena1.github.io"; git push; fi
